syntax = "proto3";

package CLRPC;

service SimpleServer{
    rpc Echo (EchoRequest) returns (EchoResponse);
    rpc Add (AddRequest) returns (AddResponse);
}

message EchoRequest{
    string msg = 1;
}

message EchoResponse{
    string reply = 1;
    int32 code = 2;
}

message AddRequest{
    int64 a = 1;
    int64 b = 2;
}

message AddResponse{
    int64 result = 1;
    string Error = 2;
}